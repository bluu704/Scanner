<title>포켓 스캐너</title>

<style>
/* Layout: one-screen app. A page stack (grid of scanned sheets) above an icon capture dock; camera and scan editor are full-screen dark layers. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --mat: #DCE1E8;
  --ink: #131922;
  --muted: #5A6472;
  --line: #CBD3DD;
  --accent: #2A43D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #DEE3FB;
  --danger: #BF3227;
  --scan: #5B8CFF;
  /* camera + editor layers keep one dark look in both themes */
  --scr-bg: #0A0C10;
  --scr-panel: #13161C;
  --scr-raise: #1F232B;
  --scr-fg: #F1F3F6;
  --scr-muted: #9AA3B0;
  --scr-line: #2A303A;
  --scr-accent: #8C9BFF;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1217; --surface: #171C23; --mat: #222932; --ink: #E7EBF0; --muted: #96A0AD;
    --line: #2B333D; --accent: #8291FF; --accent-ink: #0E1217; --accent-soft: #232A4C; --danger: #FF6E61;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1217; --surface: #171C23; --mat: #222932; --ink: #E7EBF0; --muted: #96A0AD;
  --line: #2B333D; --accent: #8291FF; --accent-ink: #0E1217; --accent-soft: #232A4C; --danger: #FF6E61;
  color-scheme: dark;
}
/* the app's own theme setting wins over system and host */
:root[data-app-theme="light"] {
  --bg: #EDF0F4; --surface: #FFFFFF; --mat: #DCE1E8; --ink: #131922; --muted: #5A6472;
  --line: #CBD3DD; --accent: #2A43D4; --accent-ink: #FFFFFF; --accent-soft: #DEE3FB; --danger: #BF3227;
  color-scheme: light;
}
:root[data-app-theme="dark"] {
  --bg: #0E1217; --surface: #171C23; --mat: #222932; --ink: #E7EBF0; --muted: #96A0AD;
  --line: #2B333D; --accent: #8291FF; --accent-ink: #0E1217; --accent-soft: #232A4C; --danger: #FF6E61;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  line-height: 1.5; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 26px; height: 26px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- icon buttons ---------- */
.ibtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: none; transition: background .12s, color .12s; }
.ibtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ibtn:disabled { opacity: .35; cursor: default; }
.ibtn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.brand h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.brand .count { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- page stack ---------- */
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-block: 12px 24px; }
.note { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 13px; margin-bottom: 10px; }
.note span { flex: 1; min-width: 0; }
.note .ibtn { width: 34px; height: 34px; background: transparent; border-color: transparent; color: var(--accent); }

#grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 16px 14px; }
.pg { position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; border-radius: 8px; }
.pg-paper { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 8px; background: var(--mat); display: grid; place-items: center; padding: 8px; overflow: hidden; transition: box-shadow .15s; }
.pg-paper img { max-width: 100%; max-height: 100%; border-radius: 2px; box-shadow: 0 1px 2px rgb(0 0 0 / .18), 0 4px 12px rgb(0 0 0 / .10); pointer-events: none; }
.pg-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; padding-inline: 2px; }
.pg-num { font-family: var(--font-mono); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pg-mode { display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pg-tag { position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: var(--ink); color: var(--bg); }
.pg-check { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgb(0 0 0 / .25); display: none; place-items: center; box-shadow: 0 1px 3px rgb(0 0 0 / .3); }
.selecting .pg-check { display: grid; }
.pg.is-selected .pg-paper { box-shadow: inset 0 0 0 3px var(--accent); }
.pg.is-selected .pg-check { background: var(--accent); border-color: var(--accent); }
.pg.is-selected .pg-check::after { content: ""; width: 10px; height: 5px; border: solid #fff; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
.pg-ghost { opacity: .3; }
.pg-chosen .pg-paper { box-shadow: 0 10px 28px rgb(0 0 0 / .28); }
.pg-drag { transform: rotate(-2deg); }
/* group drag: the held page carries a count badge and a paper stack; the rest of the selection dims */
.pg[data-carry]::before { content: attr(data-carry); position: absolute; top: -8px; right: -8px; z-index: 3; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font: 600 13px/28px var(--font-mono); text-align: center; box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
.pg[data-carry] .pg-paper { box-shadow: inset 0 0 0 3px var(--accent), 5px 5px 0 0 var(--mat), 5px 5px 0 1px var(--line), 10px 10px 0 0 var(--mat), 10px 10px 0 1px var(--line); }
.carrying .pg.is-selected:not([data-carry]) { opacity: .3; transform: scale(.94); transition: opacity .15s, transform .15s; }

/* scanning sweep — the light bar of a flatbed scanner */
.sweep::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26%; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--scan) 45%, transparent) 85%, var(--scan) 100%); animation: sweep 1.2s cubic-bezier(.5,0,.5,1) infinite; pointer-events: none; }
@keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(390%); } }
@media (prefers-reduced-motion: reduce) { .sweep::after { animation: none; transform: none; height: 100%; opacity: .25; } }

.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 56px 12px; color: var(--muted); font-size: 14px; }
.empty .ring { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px dashed var(--line); color: var(--ink); }

/* ---------- dock ---------- */
.dock { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 10px 12px; border-top: 1px solid var(--line); background: var(--surface); }
.dock .ibtn { width: 52px; height: 52px; background: var(--bg); border-color: transparent; }
.dock .ibtn.danger { background: var(--danger); }
.shutter { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--ink); padding: 4px; display: grid; place-items: center; }
.shutter span { width: 100%; height: 100%; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); transition: transform .1s; }
.shutter:active span { transform: scale(.9); }
.sel-count { justify-self: center; font-family: var(--font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }

/* ---------- full-screen dark layers ---------- */
.screen {
  position: fixed; inset: 0; z-index: 20; background: var(--scr-bg); color: var(--scr-fg);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
.screen :focus-visible { outline-color: var(--scr-accent); }
.scr-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; position: relative; z-index: 2; }
.scr-title { flex: 1; text-align: center; min-width: 0; font-family: var(--font-mono); font-size: 13px; color: var(--scr-muted); font-variant-numeric: tabular-nums; }
.dbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--scr-fg); flex: none; position: relative; }
.dbtn:hover { background: var(--scr-raise); }
.dbtn[aria-pressed="true"] { background: var(--scr-fg); color: var(--scr-bg); }
.dbtn:disabled { opacity: .35; cursor: default; }
.badge { position: absolute; top: -2px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--scr-accent); color: var(--scr-bg); font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; display: grid; place-items: center; }

/* camera */
.cam-view { position: absolute; inset: 0; overflow: hidden; }
.cam-view video, .cam-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam-view video { object-fit: cover; }
.cam .scr-top { background: linear-gradient(rgb(0 0 0 / .55), transparent); justify-content: space-between; }
.cam-bottom { margin-top: auto; position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 24px 22px; background: linear-gradient(transparent, rgb(0 0 0 / .65)); }
.cam-bottom .shutter { width: 78px; height: 78px; border-color: var(--scr-fg); }
.cam-bottom .shutter span { background: var(--scr-fg); }
.cam-bottom .dbtn { width: 52px; height: 52px; background: var(--scr-raise); }
.cam-auto { justify-self: start; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--scr-muted); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }
.flash.on { animation: flash .28s ease-out; }
@keyframes flash { from { opacity: .8; } to { opacity: 0; } }

/* editor */
.ed-stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 8px 16px 12px; }
.ed-sheet { position: relative; display: grid; place-items: center; max-width: 100%; max-height: 100%; touch-action: none; }
#edCanvas { display: block; max-width: calc(100vw - 32px); max-height: calc(100dvh - 290px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); width: auto; height: auto; box-shadow: 0 6px 30px rgb(0 0 0 / .5); background: var(--scr-raise); }
.chip { position: absolute; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 15px; background: rgb(10 12 16 / .78); color: var(--scr-fg); font-size: 12px; font-family: var(--font-mono); border: 1px solid var(--scr-line); backdrop-filter: blur(6px); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
#edGlare { top: 14px; left: 22px; }
#edFix { top: 14px; right: 22px; }
#edChip { top: 50%; left: 50%; transform: translate(-50%, -50%); height: 40px; padding: 0 16px; font-family: var(--font-body); font-size: 15px; font-weight: 600; border-radius: 20px; opacity: 0; transition: opacity .2s; }
#edChip.show { opacity: 1; }
.compare { position: absolute; right: 22px; bottom: 20px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgb(10 12 16 / .78); color: var(--scr-fg); border: 1px solid var(--scr-line); backdrop-filter: blur(6px); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.compare[aria-pressed="true"] { background: var(--scr-fg); color: var(--scr-bg); }
.ed-busy { position: absolute; inset: 0; display: grid; place-items: center; color: var(--scr-muted); }
.ed-panel { background: var(--scr-panel); border-top: 1px solid var(--scr-line); border-radius: 18px 18px 0 0; padding: 12px 16px 14px; display: grid; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--scr-raise); }
.seg button { height: 42px; border-radius: 9px; color: var(--scr-muted); display: grid; place-items: center; }
.seg button[aria-checked="true"] { background: var(--scr-fg); color: var(--scr-bg); }
.row { display: flex; align-items: center; gap: 10px; }
.row output { font-family: var(--font-mono); font-size: 13px; width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; }
.row .dim { color: var(--scr-muted); }
.tbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--scr-raise); color: var(--scr-muted); flex: none; }
.tbtn[aria-pressed="true"] { background: var(--scr-accent); color: var(--scr-bg); }
.tbtn:disabled { opacity: .35; cursor: default; }
input[type="range"] { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 28px; background: transparent; --pct: 60%; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--scr-accent) var(--pct), var(--scr-line) var(--pct)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--scr-accent) var(--pct), var(--scr-line) var(--pct)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--scr-fg); margin-top: -9px; box-shadow: 0 1px 4px rgb(0 0 0 / .5); }
input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--scr-fg); }
input[type="range"]:disabled { opacity: .35; }
.acts { display: flex; gap: 8px; }
.acts .abtn { flex: 1; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--scr-raise); color: var(--scr-fg); }
.acts .abtn.primary { background: var(--scr-accent); color: var(--scr-bg); flex: 1.6; }

/* crop overlay */
.crop-ui { position: absolute; inset: 0; }
.crop-ui svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.crop-ui polygon { fill: color-mix(in srgb, var(--scr-accent) 18%, transparent); stroke: var(--scr-accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.handle::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--scr-fg); border: 3px solid var(--scr-accent); box-shadow: 0 1px 4px rgb(0 0 0 / .6); }
.loupe { position: absolute; width: 104px; height: 104px; border-radius: 50%; border: 3px solid var(--scr-fg); box-shadow: 0 4px 16px rgb(0 0 0 / .6); pointer-events: none; margin: -52px 0 0 -52px; background: var(--scr-bg); }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgb(8 10 14 / .5); }
.sheet { position: relative; background: var(--surface); color: var(--ink); border-radius: 20px 20px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; max-height: 92%; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto; }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 2px; }
.sheet h2 { margin: 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sheet h2 .count { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--muted); }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field > .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.sheet .seg { background: var(--bg); }
.sheet .seg button { color: var(--muted); height: auto; min-height: 56px; padding: 6px 4px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12px; font-weight: 600; }
.sheet .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
.name-row { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding-right: 12px; }
.name-row input { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; padding: 0 12px; font: inherit; color: var(--ink); }
.name-row span { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.progress { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .track { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.btn { height: 50px; border-radius: 14px; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .4; cursor: default; }
.set-list { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; flex: none; }
.set-row .txt { flex: 1; min-width: 0; }
.set-row .txt b { display: block; font-size: 14.5px; font-weight: 600; }
.set-row .txt small { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.set-row.off .txt, .set-row.off .ico { opacity: .45; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(108px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; display: flex; gap: 14px; align-items: center; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / .25); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--bg); font-weight: 700; font-size: 13.5px; flex: none; display: flex; align-items: center; gap: 4px; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .toast, .flash.on, #edChip { transition: none; animation: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const MAX_SRC = 2400;      // long side kept for each page
const THUMB = 520;         // long side of grid thumbnails
const MODE_LABEL = { original: '원본', color: '컬러', gray: '회색조', bw: '흑백' };
const MODE_ICON = { original: 'i-m-original', color: 'i-m-color', gray: 'i-m-gray', bw: 'i-m-bw' };
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

/* ---------- Android app (Capacitor) bridge; absent in a browser ---------- */
const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const plugin = (name) => (native && window.Capacitor.Plugins ? window.Capacitor.Plugins[name] || null : null);
function syncBars() {
  const bars = plugin('SystemBars');
  if (!bars) return;
  const overlay = !$('#editor').hidden || !$('#camera').hidden;
  const dark = overlay || settings.theme === 'dark' || (settings.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  Promise.resolve(bars.setStyle({ style: dark ? 'DARK' : 'LIGHT' })).catch(() => {});
}
if (native) {
  ['#editor', '#camera'].forEach((s) => new MutationObserver(syncBars).observe($(s), { attributes: true, attributeFilter: ['hidden'] }));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBars);
}

/* ---------- settings ---------- */
const SETTINGS_KEY = 'pocket-scanner.settings';
const settings = { autoCrop: true, flatten: true, deskew: true, deglare: true, theme: 'system' };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch {}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }
function applyTheme() {
  if (settings.theme === 'system') delete document.documentElement.dataset.appTheme;
  else document.documentElement.dataset.appTheme = settings.theme;
  syncBars();
}
applyTheme();

const pages = [];
let lastParams = { mode: 'color', white: 60 };

/* =========================================================
   Geometry 4 — deskew: the angle where ink pixels pile up
   into the sharpest rows is the text-line angle.
   ========================================================= */
function estimateSkew(canvas) {
  const c = scaledCanvas(canvas, canvas.width, canvas.height, 800);
  const w = c.width, h = c.height, n = w * h;
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const L = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) L[i] = lum(d[j], d[j + 1], d[j + 2]);
  const mean = boxBlur(L, w, h, 10);
  const xs = [], ys = [];
  for (let i = 0; i < n; i++) if (L[i] < mean[i] - 22) { xs.push(i % w); ys.push((i / w) | 0); }
  if (xs.length < 300) return { angle: 0, fill: null };
  const step = Math.max(1, Math.floor(xs.length / 40000));
  const off = w + h, bins = new Float32Array(2 * off + h);
  const score = (deg) => {
    const a = (deg * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
    bins.fill(0);
    for (let k = 0; k < xs.length; k += step) bins[Math.round(ys[k] * ca - xs[k] * sa) + off]++;
    let s = 0; for (let k = 0; k < bins.length; k++) s += bins[k] * bins[k];
    return s;
  };
  let best = 0, bestS = -1;
  for (let a = -15; a <= 15; a += 0.5) { const s = score(a); if (s > bestS) { bestS = s; best = a; } }
  const coarse = best;
  for (let a = coarse - 0.5; a <= coarse + 0.5; a += 0.1) { const s = score(a); if (s > bestS) { bestS = s; best = a; } }
  if (bestS < score(0) * 1.03) best = 0;
  // paper colour for the corners uncovered by rotation
  const samp = [];
  for (let k = 0; k < 400; k++) { const i = ((k * 7919) % n) * 4; samp.push([lum(d[i], d[i + 1], d[i + 2]), d[i], d[i + 1], d[i + 2]]); }
  samp.sort((a, b) => a[0] - b[0]);
  const p = samp[Math.floor(samp.length * 0.8)];
  return { angle: best, fill: `rgb(${p[1]},${p[2]},${p[3]})` };
}
function deskew(canvas) {
  const { angle, fill } = estimateSkew(canvas);
  if (Math.abs(angle) < 0.2) return { canvas, angle: 0 };
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const x = out.getContext('2d', { willReadFrequently: true });
  x.fillStyle = fill; x.fillRect(0, 0, out.width, out.height);
  x.translate(out.width / 2, out.height / 2);
  x.rotate((-angle * Math.PI) / 180);
  x.imageSmoothingQuality = 'high';
  x.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return { canvas: out, angle };
}

/* page geometry: crop/flatten (settings or the page's manual crop), then deskew */
function geometry(det, crop, src) {
  let quad = null;
  if (crop && crop.quad) quad = crop.quad;
  else if (!crop && settings.autoCrop && det) quad = det.quad;
  const info = { cropped: !!quad, flattened: false, angle: 0 };
  let c = src;
  if (quad) {
    const curves = settings.flatten && det ? findCurves(det, quad) : null;
    info.flattened = !!curves;
    c = warp(src, quad, curves);
  }
  if (settings.deskew) { const r = deskew(c); c = r.canvas; info.angle = r.angle; }
  return { canvas: c, info };
}
function ensureDet(page, src) {
  if (page.det === undefined) page.det = detectDoc(src);
  return page.det;
}

/* =========================================================
   Tone: glare removal + paper whitening
   ========================================================= */
function analyze(img, deglare) {
  const { width: W, height: H, data: d } = img;
  const sc = Math.max(W, H) / 128;
  const sw = Math.max(2, Math.round(W / sc)), sh = Math.max(2, Math.round(H / sc)), n = sw * sh;
  const cx = new Int32Array(W);
  for (let x = 0; x < W; x++) cx[x] = Math.min(sw - 1, ((x * sw) / W) | 0);
  const sumL = new Float32Array(n), cnt = new Float32Array(n);
  for (let y = 0; y < H; y++) {
    const row = Math.min(sh - 1, ((y * sh) / H) | 0) * sw;
    for (let x = 0, i = y * W * 4; x < W; x++, i += 4) { const c = row + cx[x]; sumL[c] += lum(d[i], d[i + 1], d[i + 2]); cnt[c]++; }
  }
  for (let c = 0; c < n; c++) sumL[c] /= cnt[c] || 1;
  let R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n);
  const c2 = new Float32Array(n);
  for (let y = 0; y < H; y++) {
    const row = Math.min(sh - 1, ((y * sh) / H) | 0) * sw;
    for (let x = 0, i = y * W * 4; x < W; x++, i += 4) {
      const c = row + cx[x];
      if (lum(d[i], d[i + 1], d[i + 2]) >= sumL[c]) { R[c] += d[i]; G[c] += d[i + 1]; B[c] += d[i + 2]; c2[c]++; }
    }
  }
  for (let c = 0; c < n; c++) { if (c2[c]) { R[c] /= c2[c]; G[c] /= c2[c]; B[c] /= c2[c]; } else { R[c] = G[c] = B[c] = sumL[c]; } }
  {
    const L0 = new Float32Array(n);
    for (let c = 0; c < n; c++) L0[c] = lum(R[c], G[c], B[c]);
    const R2 = new Float32Array(n), G2 = new Float32Array(n), B2 = new Float32Array(n);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      let best = y * sw + x;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const yy = y + dy, xx = x + dx;
        if (yy < 0 || yy >= sh || xx < 0 || xx >= sw) continue;
        const k = yy * sw + xx;
        if (L0[k] > L0[best]) best = k;
      }
      const c = y * sw + x;
      R2[c] = R[best]; G2[c] = G[best]; B2[c] = B[best];
    }
    R = boxBlur(R2, sw, sh, 1); G = boxBlur(G2, sw, sh, 1); B = boxBlur(B2, sw, sh, 1);
  }
  let gl = new Float32Array(n);
  let glarePct = 0;
  if (deglare) {
    const L = new Float32Array(n);
    for (let c = 0; c < n; c++) L[c] = lum(R[c], G[c], B[c]);
    const rad = Math.max(3, Math.round(Math.max(sw, sh) / 6));
    const base = boxBlur(L, sw, sh, rad);
    const m = new Float32Array(n);
    for (let it = 0; it < 3; it++) {
      for (let c = 0; c < n; c++) {
        const mx = Math.max(R[c], G[c], B[c]), mn = Math.min(R[c], G[c], B[c]);
        m[c] = L[c] - base[c] > 6 && L[c] > 140 && mx - mn < 50 ? 1 : 0;
      }
      const wv = new Float32Array(n), wl = new Float32Array(n);
      for (let c = 0; c < n; c++) { wv[c] = 1 - m[c]; wl[c] = L[c] * wv[c]; }
      const bw = boxBlur(wv, sw, sh, rad), bl = boxBlur(wl, sw, sh, rad);
      for (let c = 0; c < n; c++) if (bw[c] > 0.05) base[c] = bl[c] / bw[c];
    }
    // glare blends the paper toward white: seen = paper*(1-a) + 255*a  ->  solve for a
    for (let c = 0; c < n; c++) gl[c] = m[c] ? Math.min(0.88, Math.max(0, (L[c] - base[c] - 3) / Math.max(20, 255 - base[c]))) : 0;
    gl = boxBlur(boxBlur(gl, sw, sh, 1), sw, sh, 1);
    let hit = 0;
    for (let c = 0; c < n; c++) if (gl[c] > 0.03) hit++;
    glarePct = (hit / n) * 100;
  }
  return { sw, sh, R, G, B, gl, glarePct };
}
function buildFull(img, an) {
  const { width: W, height: H, data: d } = img;
  const { sw, sh, R, G, B, gl } = an;
  const N = W * H;
  const corr = new Uint8ClampedArray(N * 3), norm = new Uint8ClampedArray(N * 3);
  const x0 = new Int32Array(W), x1 = new Int32Array(W), wx = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let f = ((x + 0.5) * sw) / W - 0.5;
    f = f < 0 ? 0 : f > sw - 1 ? sw - 1 : f;
    x0[x] = Math.floor(f); x1[x] = Math.min(sw - 1, x0[x] + 1); wx[x] = f - x0[x];
  }
  for (let y = 0; y < H; y++) {
    let f = ((y + 0.5) * sh) / H - 0.5;
    f = f < 0 ? 0 : f > sh - 1 ? sh - 1 : f;
    const y0 = Math.floor(f), y1 = Math.min(sh - 1, y0 + 1), wy = f - y0;
    const r0 = y0 * sw, r1 = y1 * sw;
    for (let x = 0; x < W; x++) {
      const a = r0 + x0[x], b = r0 + x1[x], c = r1 + x0[x], e = r1 + x1[x];
      const ux = wx[x];
      const w00 = (1 - ux) * (1 - wy), w01 = ux * (1 - wy), w10 = (1 - ux) * wy, w11 = ux * wy;
      const ga = gl[a] * w00 + gl[b] * w01 + gl[c] * w10 + gl[e] * w11;
      const g = 255 * ga, inv = 1 / (1 - ga);
      const br = (R[a] * w00 + R[b] * w01 + R[c] * w10 + R[e] * w11 - g) * inv;
      const bg = (G[a] * w00 + G[b] * w01 + G[c] * w10 + G[e] * w11 - g) * inv;
      const bb = (B[a] * w00 + B[b] * w01 + B[c] * w10 + B[e] * w11 - g) * inv;
      const p = y * W + x, i = p * 4, j = p * 3;
      const cr = (d[i] - g) * inv, cg = (d[i + 1] - g) * inv, cb = (d[i + 2] - g) * inv;
      corr[j] = cr; corr[j + 1] = cg; corr[j + 2] = cb;
      norm[j] = (cr * 255) / (br > 24 ? br : 24);
      norm[j + 1] = (cg * 255) / (bg > 24 ? bg : 24);
      norm[j + 2] = (cb * 255) / (bb > 24 ? bb : 24);
    }
  }
  return { corr, norm };
}
function renderPixels(img, full, p, out) {
  const d = img.data, o = out.data, N = img.width * img.height;
  if (p.mode === 'original') { o.set(d); return out; }
  const t = p.white / 100;
  const { corr, norm } = full;
  if (p.mode === 'bw') {
    const thr = 205 - 110 * t;
    for (let i = 0; i < N; i++) {
      const j = i * 3, q = i * 4;
      const v = (lum(norm[j], norm[j + 1], norm[j + 2]) - thr) * 4 + 128;
      o[q] = o[q + 1] = o[q + 2] = v; o[q + 3] = 255;
    }
    return out;
  }
  const k = Math.min(1, t * 1.6), Wp = 255 - 60 * t, Bp = 4 + 42 * t, sc = 255 / (Wp - Bp), sat = 1 + 0.3 * t;
  const gray = p.mode === 'gray';
  for (let i = 0; i < N; i++) {
    const j = i * 3, q = i * 4;
    let r = (corr[j] * (1 - k) + norm[j] * k - Bp) * sc;
    let g = (corr[j + 1] * (1 - k) + norm[j + 1] * k - Bp) * sc;
    let b = (corr[j + 2] * (1 - k) + norm[j + 2] * k - Bp) * sc;
    const l = lum(r, g, b);
    if (gray) { r = g = b = l; } else { r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat; }
    o[q] = r; o[q + 1] = g; o[q + 2] = b; o[q + 3] = 255;
  }
  return out;
}

async function processPage(page, maxSide) {
  const src = await blobToCanvas(page.blob, maxSide);
  ensureDet(page, src);
  const { canvas: geo } = geometry(page.det, page.crop, src);
  const ctx = geo.getContext('2d', { willReadFrequently: true });
  if (page.params.mode !== 'original') {
    const img = ctx.getImageData(0, 0, geo.width, geo.height);
    const out = ctx.createImageData(img.width, img.height);
    renderPixels(img, buildFull(img, analyze(img, page.params.deglare)), page.params, out);
    ctx.putImageData(out, 0, 0);
  }
  const dst = document.createElement('canvas');
  drawRotated(geo, page.params.rot, dst);
  return dst;
}

/* =========================================================
   Pages
   ========================================================= */
/* ---------- saved pages: kept on this device in IndexedDB ---------- */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('scanner', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('pages', { keyPath: 'id' });
      r.result.createObjectStore('thumbs', { keyPath: 'id' });
      r.result.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  // run fn(transaction) and resolve when it commits; storage problems never break the app
  const run = async (mode, fn) => {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const t = db.transaction(['pages', 'thumbs', 'meta'], mode);
        const out = fn(t);
        t.oncomplete = () => res(out);
        t.onerror = t.onabort = () => rej(t.error);
      });
    } catch (e) { console.warn('storage', e); return null; }
  };
  const record = (p) => ({ id: p.id, blob: p.blob, params: p.params, crop: p.crop, saved: Date.now() });
  return {
    async load() {
      const r = await run('readonly', (t) => ({
        pages: t.objectStore('pages').getAll(), thumbs: t.objectStore('thumbs').getAll(), order: t.objectStore('meta').get('order'),
      }));
      if (!r) return [];
      const thumbs = new Map((r.thumbs.result || []).map((x) => [x.id, x.blob]));
      const order = r.order.result || [];
      const rank = (id) => { const i = order.indexOf(id); return i < 0 ? 1e9 : i; };
      return (r.pages.result || []).sort((a, b) => rank(a.id) - rank(b.id) || a.saved - b.saved).map((x) => ({ ...x, thumb: thumbs.get(x.id) || null }));
    },
    save(list) {
      list = list.filter((p) => !p.sample);
      if (list.length) run('readwrite', (t) => list.forEach((p) => t.objectStore('pages').put(record(p))));
    },
    saveThumb(p) { if (!p.sample && p.thumbBlob) run('readwrite', (t) => t.objectStore('thumbs').put({ id: p.id, blob: p.thumbBlob })); },
    remove(list) {
      run('readwrite', (t) => list.forEach((p) => { t.objectStore('pages').delete(p.id); t.objectStore('thumbs').delete(p.id); }));
    },
    order() { const ids = pages.filter((p) => !p.sample).map((p) => p.id); run('readwrite', (t) => t.objectStore('meta').put(ids, 'order')); },
  };
})();
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function newPage(blob, sample = false) {
  return { id: newId(), blob, sample, det: undefined, crop: undefined, params: { ...lastParams, deglare: settings.deglare, rot: 0 }, thumbUrl: null, pending: true };
}
async function pageFromFile(file) {
  const c = await blobToCanvas(file, MAX_SRC);
  const p = newPage(await canvasToBlob(c, 0.92));
  ensureDet(p, c);
  return p;
}
let thumbChain = Promise.resolve();
function queueThumb(page) {
  page.pending = true;
  updateItem(page);
  thumbChain = thumbChain.then(async () => {
    if (!pages.includes(page)) { page.pending = false; return; }
    const c = await processPage(page, THUMB);
    const b = await canvasToBlob(c, 0.85);
    if (page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
    page.thumbUrl = URL.createObjectURL(b);
    page.thumbBlob = b;
    store.saveThumb(page);
    page.pending = false;
    updateItem(page);
    await new Promise((r) => setTimeout(r, 0));
  }).catch((e) => { console.error(e); page.pending = false; updateItem(page); });
}

   Grid
   ========================================================= */
const grid = $('#grid');
const main = $('#main');
function itemEl(p) {
  const li = document.createElement('li');
  li.className = 'pg';
  li.dataset.id = p.id;
  li.tabIndex = 0;
  li.innerHTML = '<div class="pg-paper"><img alt="" draggable="false"></div><div class="pg-meta"><span class="pg-num"></span><span class="pg-mode"></span></div><span class="pg-check" aria-hidden="true"></span>';
  if (p.sample) { const t = document.createElement('span'); t.className = 'pg-tag'; t.textContent = '예시'; li.appendChild(t); }
  return li;
}
function fillItem(li, p, i) {
  const img = li.querySelector('img');
  if (p.thumbUrl && img.getAttribute('src') !== p.thumbUrl) img.src = p.thumbUrl;
  img.hidden = !p.thumbUrl;
  li.querySelector('.pg-paper').classList.toggle('sweep', p.pending);
  li.querySelector('.pg-num').textContent = 'P.' + String(i + 1).padStart(2, '0');
  const mode = p.params.mode;
  li.querySelector('.pg-mode').innerHTML = icon(MODE_ICON[mode], 'i sm') + (mode === 'original' ? '' : p.params.white);
  li.classList.toggle('is-selected', selected.has(p.id));
  li.setAttribute('aria-label', `${i + 1}쪽, ${MODE_LABEL[mode]}`);
}
function renderGrid() {
  const have = new Map([...grid.children].map((li) => [li.dataset.id, li]));
  pages.forEach((p, i) => {
    let li = have.get(p.id);
    if (!li) li = itemEl(p); else have.delete(p.id);
    grid.appendChild(li);
    fillItem(li, p, i);
  });
  have.forEach((li) => li.remove());
  $('#count').innerHTML = icon('i-pdf', 'i sm') + pages.length;
  $('#count').setAttribute('aria-label', `총 ${pages.length}쪽`);
  $('#empty').hidden = pages.length > 0;
  $('#sampleNote').hidden = !pages.some((p) => p.sample);
  $('#btnExport').disabled = pages.length === 0;
  $('#btnSelect').disabled = pages.length === 0 && !selectMode;
  grid.classList.toggle('selecting', selectMode);
  updateSelDock();
}
function updateItem(p) {
  const li = grid.querySelector(`[data-id="${p.id}"]`);
  if (li) fillItem(li, p, pages.indexOf(p));
}
// in select mode, dragging a selected page carries every selected page as one block
const carriesGroup = (li) => selectMode && selected.size > 1 && selected.has(li.dataset.id);
if (window.Sortable) {
  Sortable.create(grid, {
    animation: 180, delay: 220, delayOnTouchOnly: true, touchStartThreshold: 6,
    ghostClass: 'pg-ghost', chosenClass: 'pg-chosen', dragClass: 'pg-drag',
    onChoose(e) {
      if (!carriesGroup(e.item)) return;
      e.item.dataset.carry = selected.size;
      grid.classList.add('carrying');
    },
    onUnchoose(e) {
      delete e.item.dataset.carry;
      grid.classList.remove('carrying');
    },
    onEnd(e) {
      let order = [...grid.children].map((li) => li.dataset.id);
      const group = carriesGroup(e.item) && e.oldIndex !== e.newIndex;
      if (group) {
        const dragId = e.item.dataset.id;
        const block = pages.filter((p) => selected.has(p.id)).map((p) => p.id);
        order = order.filter((id) => id === dragId || !selected.has(id));
        order.splice(order.indexOf(dragId), 1, ...block);
      }
      pages.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
      renderGrid();
      store.order();
      if (group) toast(`${selected.size}장 함께 이동`);
    },
  });
}
grid.addEventListener('click', (e) => {
  const li = e.target.closest('.pg');
  if (!li) return;
  const p = pages.find((x) => x.id === li.dataset.id);
  if (!p) return;
  if (selectMode) {
    selected.has(p.id) ? selected.delete(p.id) : selected.add(p.id);
    fillItem(li, p, pages.indexOf(p));
    updateSelDock();
  } else {
    openEditor(p, { isNew: false });
  }
});
grid.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('pg')) { e.preventDefault(); e.target.click(); }
});
grid.addEventListener('contextmenu', (e) => e.preventDefault());

/* selection + delete */
function setSelectMode(on) {
  selectMode = on;
  selected.clear();
  const b = $('#btnSelect');
  b.setAttribute('aria-pressed', String(on));
  b.innerHTML = icon(on ? 'i-close' : 'i-select');
  b.setAttribute('aria-label', on ? '선택 끝내기' : '선택');
  b.title = on ? '선택 끝내기' : '선택';
  $('#dock').hidden = on;
  $('#selDock').hidden = !on;
  renderGrid();
}
function updateSelDock() {
  const n = selected.size;
  $('#selCount').innerHTML = icon('i-check', 'i sm') + n;
  $('#btnDelete').disabled = n === 0;
  const all = n > 0 && n === pages.length;
  $('#btnSelAll').setAttribute('aria-pressed', String(all));
  $('#btnSelAll').setAttribute('aria-label', all ? '선택 해제' : '전체 선택');
}
$('#btnSelect').onclick = () => setSelectMode(!selectMode);
$('#btnSelAll').onclick = () => {
  if (selected.size === pages.length) selected.clear(); else pages.forEach((p) => selected.add(p.id));
  renderGrid();
};
function removePages(pred, label) {
  const removed = [];
  for (let i = pages.length - 1; i >= 0; i--) if (pred(pages[i])) removed.unshift({ p: pages.splice(i, 1)[0], i });
  if (!removed.length) return;
  if (selectMode) setSelectMode(false); else renderGrid();
  const list = removed.map((r) => r.p);
  store.remove(list);
  store.order();
  toast(label(removed.length), '되돌리기', () => {
    removed.forEach(({ p, i }) => pages.splice(Math.min(i, pages.length), 0, p));
    renderGrid();
    store.save(list);
    list.forEach((p) => store.saveThumb(p));
    store.order();
  });
}
$('#btnDelete').onclick = () => removePages((p) => selected.has(p.id), (n) => `${n}장 삭제됨`);
$('#btnClearSamples').onclick = () => removePages((p) => p.sample, (n) => `예시 ${n}장 지움`);

const fileInput = $('#fileInput');
$('#btnImport').onclick = () => { fileInput.value = ''; fileInput.click(); };
fileInput.onchange = async () => {
  const files = [...fileInput.files];
  if (!files.length) return;
  let ok = 0, bad = 0;

          else doc.addPage('a4', land ? 'l' : 'p');
          const s = Math.min(pw / c.width, ph / c.height), w = c.width * s, h = c.height * s;
          doc.addImage(u8, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
        } else {
          const mm = 25.4 / 200, pw = c.width * mm, ph = c.height * mm, o = pw > ph ? 'l' : 'p';
          if (!doc) doc = new jsPDF({ unit: 'mm', format: [pw, ph], orientation: o, compress: true });
          else doc.addPage([pw, ph], o);
          doc.addImage(u8, 'JPEG', 0, 0, pw, ph, undefined, 'FAST');
        }
      }
      progress(total, total, 'PDF…');
      const ok = await saveFile(doc.output('blob'), `${name}.pdf`);
      finishExport(ok ? `${name}.pdf 저장함 · ${total}쪽` : '저장을 취소했어요');
    } else {
      const files = [];
      for (let i = 0; i < total; i++) {
        progress(i, total, `${i + 1} / ${total}`);
        const c = await processPage(list[i], MAX_SRC);
        files.push({ name: total > 1 ? `${name}_${String(i + 1).padStart(2, '0')}.jpg` : `${name}.jpg`, blob: await canvasToBlob(c, 0.92) });
      }
      if (total === 1) {
        finishExport((await saveFile(files[0].blob, files[0].name)) ? `${files[0].name} 저장함` : '저장을 취소했어요');
      } else if (ex.pack === 'zip') {
        progress(total, total, 'ZIP…');
        const z = new JSZip();
        files.forEach((f) => z.file(f.name, f.blob));
        const ok = await saveFile(await z.generateAsync({ type: 'blob' }), `${name}.zip`);
        finishExport(ok ? `${name}.zip 저장함 · ${total}장` : '저장을 취소했어요');
      } else if (native) {
        finishExport((await nativeSave(files)) ? `이미지 ${files.length}장 내보냄` : '저장을 취소했어요');
      } else {
        let saved = 0;
        for (let i = 0; i < files.length; i++) {
          progress(i, files.length, `${i + 1} / ${files.length}`);
          if (await saveFile(files[i].blob, files[i].name)) saved++;
        }
        finishExport(`이미지 ${saved}장 저장함`);
      }
    }
  } catch (e) {
    console.error(e);
    finishExport(e && e.code === 'too_large' ? '파일이 너무 커요. 이미지 ZIP이나 한 장씩 저장을 써보세요.' : '저장하지 못했어요. 잠시 후 다시 눌러주세요.', true);
  }
};

function drawTri(ctx, img, s, d) {
  const [[sx0, sy0], [sx1, sy1], [sx2, sy2]] = s, [[dx0, dy0], [dx1, dy1], [dx2, dy2]] = d;
  const den = (sx1 - sx0) * (sy2 - sy0) - (sx2 - sx0) * (sy1 - sy0);
  const a = ((dx1 - dx0) * (sy2 - sy0) - (dx2 - dx0) * (sy1 - sy0)) / den;
  const c = ((dx2 - dx0) * (sx1 - sx0) - (dx1 - dx0) * (sx2 - sx0)) / den;
  const b = ((dy1 - dy0) * (sy2 - sy0) - (dy2 - dy0) * (sy1 - sy0)) / den;
  const dd = ((dy2 - dy0) * (sx1 - sx0) - (dy1 - dy0) * (sx2 - sx0)) / den;
  const cx = (dx0 + dx1 + dx2) / 3, cy = (dy0 + dy1 + dy2) / 3;
  const grow = (px, py) => { const l = Math.hypot(px - cx, py - cy) || 1; return [px + ((px - cx) / l) * 0.8, py + ((py - cy) / l) * 0.8]; };
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(...grow(dx0, dy0)); ctx.lineTo(...grow(dx1, dy1)); ctx.lineTo(...grow(dx2, dy2));
  ctx.closePath(); ctx.clip();
  ctx.setTransform(a, b, c, dd, dx0 - a * sx0 - c * sy0, dy0 - b * sx0 - dd * sy0);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
function samplePhoto(kind) {
  const doc = sampleDoc(kind), DW = doc.width, DH = doc.height;
  const W = 1500, H = 2000;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  // desk
  const desk = x.createLinearGradient(0, 0, W, H);
  desk.addColorStop(0, '#5b4635'); desk.addColorStop(1, '#3a2c22');
  x.fillStyle = desk; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 140; i++) {
    x.strokeStyle = `rgba(${i % 2 ? '20,12,6' : '120,90,60'},0.09)`; x.lineWidth = 1 + (i % 4);
    const y0 = (i * 97) % H; x.beginPath(); x.moveTo(0, y0); x.bezierCurveTo(W * 0.3, y0 + 20, W * 0.7, y0 - 25, W, y0 + 8); x.stroke();
  }
  // where the paper lies: corners + edge curl (top/bottom bulge in px)
  const tilted = (deg, cx, cy, hw, hh) => {
    const a = (deg * Math.PI) / 180, r = (u, v) => [cx + u * Math.cos(a) - v * Math.sin(a), cy + u * Math.sin(a) + v * Math.cos(a)];
    return [r(-hw, -hh), r(hw, -hh), r(hw, hh), r(-hw, hh)];
  };
  const cfg = {
    minutes: { q: [[250, 230], [1300, 300], [1360, 1790], [170, 1750]], bt: 0, bb: 46 },
    quote: { q: tilted(8, 750, 1010, 520, 693), bt: 0, bb: 0 },
    receipt: { q: [[280, 210], [1230, 180], [1270, 1820], [230, 1850]], bt: -70, bb: 70 },
  }[kind];
  const F = (u, v) => {
    const [a, b, cc, d] = cfg.q;
    const px = (1 - u) * (1 - v) * a[0] + u * (1 - v) * b[0] + u * v * cc[0] + (1 - u) * v * d[0];
    const py = (1 - u) * (1 - v) * a[1] + u * (1 - v) * b[1] + u * v * cc[1] + (1 - u) * v * d[1];
    return [px, py + ((1 - v) * cfg.bt + v * cfg.bb) * Math.sin(Math.PI * u)];
  };

  x.save();

  x.fillStyle = '#d8d0c0'; x.beginPath();
  for (let k = 0; k <= 40; k++) { const p = F(k / 40, 0); if (k) x.lineTo(...p); else x.moveTo(...p); }
  for (let k = 0; k <= 40; k++) x.lineTo(...F(1, k / 40));
  for (let k = 40; k >= 0; k--) x.lineTo(...F(k / 40, 1));
  for (let k = 40; k >= 0; k--) x.lineTo(...F(0, k / 40));
  x.closePath(); x.fill();
  x.restore();
  // paper, drawn as a mesh of textured triangles
  const GX = 16, GY = 20;
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
    const u0 = i / GX, u1 = (i + 1) / GX, v0 = j / GY, v1 = (j + 1) / GY;
    const s00 = [u0 * DW, v0 * DH], s10 = [u1 * DW, v0 * DH], s01 = [u0 * DW, v1 * DH], s11 = [u1 * DW, v1 * DH];
    drawTri(x, doc, [s00, s10, s11], [F(u0, v0), F(u1, v0), F(u1, v1)]);
    drawTri(x, doc, [s00, s11, s01], [F(u0, v0), F(u1, v1), F(u0, v1)]);
  }
  // room light: darker towards one corner, slight vignette
  const shade = kind === 'receipt' ? x.createLinearGradient(W, 0, 0, H * 0.7) : x.createLinearGradient(0, H, W * 0.8, H * 0.15);
  shade.addColorStop(0, 'rgba(40,32,24,0.5)'); shade.addColorStop(0.45, 'rgba(40,32,24,0.12)'); shade.addColorStop(1, 'rgba(40,32,24,0)');
  x.fillStyle = shade; x.fillRect(0, 0, W, H);
  const vg = x.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.25)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
  // glare from a ceiling light, kept on the paper
  const g = { minutes: [930, 760, 220], receipt: [600, 1080, 240], quote: [860, 960, 200] }[kind];
  x.save();
  x.translate(g[0], g[1]); x.scale(1.5, 1);
  const gr = x.createRadialGradient(0, 0, 0, 0, 0, g[2]);
  gr.addColorStop(0, 'rgba(255,255,252,0.86)'); gr.addColorStop(0.35, 'rgba(255,255,250,0.55)'); gr.addColorStop(1, 'rgba(255,255,250,0)');
  x.fillStyle = gr; x.beginPath(); x.arc(0, 0, g[2], 0, Math.PI * 2); x.fill();
  x.restore();
  // sensor noise
  const id = x.getImageData(0, 0, W, H), dd = id.data;
  let s = 12345;
  for (let i = 0; i < dd.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const nz = ((s >> 8) % 13) - 6;
    dd[i] += nz; dd[i + 1] += nz; dd[i + 2] += nz;
  }
  x.putImageData(id, 0, 0);
  return c;
}
async function seedSamples() {
  try { await Promise.race([document.fonts.load('700 40px "IBM Plex Sans KR"'), new Promise((r) => setTimeout(r, 1500))]); } catch {}

    const photo = samplePhoto(k);
    const p = newPage(await canvasToBlob(photo, 0.9), true);
    ensureDet(p, photo);
    pages.push(p);
    renderGrid();
    queueThumb(p);
    await new Promise((r) => setTimeout(r, 0));
  }
}
